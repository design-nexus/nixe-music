[package]
name = "nyx-music"
version = "0.1.0"
description = "A music player for Omarchy: media library, playlists, internet radio, podcasts, equalizer and a live spectrum analyzer"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-music"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-music"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
anyhow = "1.0.104"
async-channel = "2"
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lofty = "0.25"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
unicode-normalization = "0.1.25"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
zbus = "5"
