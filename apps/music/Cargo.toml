[package]
name = "nixe-music"
version = "0.1.0"
description = "A music player for Omarchy: media library, playlists, internet radio, podcasts, equalizer and a live spectrum analyzer"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-music"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-music"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-core", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-ui = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-theme = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
anyhow = "1.0.104"
async-channel = "2"
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
lofty = "0.25"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
unicode-normalization = "0.1.25"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
zbus = "5"
